name: Continuous Deployment

on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "cd"
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assemble Quartz
        run: ./scripts/assemble.sh

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: package.json

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v4

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npx quartz build

      - name: Upload artifact for deployment
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

      - name: Save built site for notification
        uses: actions/upload-artifact@v4
        with:
          name: built-site
          path: ./public

  deploy:
    name: Deploy
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  notify:
    name: Notify
    runs-on: ubuntu-latest
    needs: deploy
    if: "!contains(github.event.head_commit.message, '[skip notify]')"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download built site
        uses: actions/download-artifact@v4
        with:
          name: built-site
          path: ./public

      - name: Notify Google via Indexing API
        env:
          GOOGLE_JSON_KEY_FILE: ${{ secrets.GOOGLE_JSON_KEY_FILE }}
        working-directory: ".github/scripts"
        shell: bash
        run: ./google.sh

      - name: Notify Bing via URL Submission API
        env:
          BING_API_KEY: ${{ secrets.BING_API_KEY }}
        working-directory: ".github/scripts"
        shell: bash
        run: ./bing.sh
