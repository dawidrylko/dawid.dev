name: PR Build

on: pull_request

permissions:
  contents: read

concurrency:
  group: "pr-build-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Assemble Quartz
        run: ./scripts/assemble.sh

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: package.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npx quartz build

      - name: Test consent layer
        run: npx tsx --test quartz/components/custom/*.test.ts

      - name: Search quality
        uses: SilesianSolutions/search-quality-kit@v0
